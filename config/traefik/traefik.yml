# ==============================================================================
# CONFIGURAÇÃO ESTÁTICA DO TRAEFIK INGRESS — ARQUITETURA SCSI (v3.1)
# ==============================================================================
global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO
  format: json

accessLog:
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: keep
      names:
        CF-Connecting-IP: keep
        CF-Ray: keep
        X-Forwarded-For: keep
        X-Forwarded-Proto: keep

# [IA & STREAMING TUNING] Timeouts ampliados para inferência de LLMs e streaming SSE/LangGraph
serversTransport:
  forwardingTimeouts:
    dialTimeout: "30s"
    responseHeaderTimeout: "300s"
    idleConnTimeout: "90s"

entryPoints:
  # Entrypoint HTTP (Redirecionamento incondicional na origem caso Always Use HTTPS falhe)
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
    forwardedHeaders:
      trustedIPs: &cloudflare_ips
        # 15 Blocos Oficiais IPv4 Cloudflare
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "172.64.0.0/13"
        - "131.0.72.0/22"
        # 7 Blocos Oficiais IPv6 Cloudflare
        - "2400:cb00::/32"
        - "2606:4700::/32"
        - "2803:f800::/32"
        - "2405:b500::/32"
        - "2405:8100::/32"
        - "2a06:98c0::/29"
        - "2c0f:f248::/32"

  # Entrypoint HTTPS Seguro (Recepção do tráfego Full Strict da Cloudflare)
  websecure:
    address: ":443"
    http:
      tls:
        options: default # Ativação global das opções TLS estritas definidas no dynamic/tls.yml
    forwardedHeaders:
      trustedIPs: *cloudflare_ips

providers:
  # Provedor Dinâmico via Docker Swarm isolado por Socket Proxy (Zero acesso ao socket físico)
  swarm:
    endpoint: "tcp://socket-proxy:2375"
    exposedByDefault: false
    network: "scsi_public"

  # Provedor Dinâmico baseado em arquivos locais para TLS e Middlewares
  file:
    directory: "/etc/traefik/dynamic"
    watch: true

api:
  dashboard: true
  insecure: false
