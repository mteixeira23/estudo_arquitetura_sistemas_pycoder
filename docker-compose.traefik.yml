version: "3.9"

# ==============================================================================
# STACK TRAEFIK INGRESS CONTROLLER & DOCKER SOCKET PROXY (PADRÃO SCSI)
# Arquitetura Zero-Root / Socket Blindado / Portas mode: host para Cloudflare Anycast
# ==============================================================================

services:
  # 1. Firewall de Acesso ao Daemon Docker (Zero Acesso de Root para o Ingress)
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      # Permissões estritas de Leitura para o Traefik descobrir containers e serviços
      CONTAINERS: 1
      SERVICES: 1
      TASKS: 1
      NODES: 1
      NETWORKS: 1
      EVENTS: 1
      VERSION: 1
      # Proibição Absoluta de Chamadas de Modificação/Escrita
      POST: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EXEC: 0
      IMAGES: 0
      INFO: 1
      PING: 1
      PLUGINS: 0
      SECRETS: 0
      SESSION: 0
      SWARM: 1
      SYSTEM: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      scsi_socket_net:
        aliases:
          - socket-proxy
          - traefik_socket-proxy
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.20"
          memory: 64M

  # 2. Ingress Controller e Reverse Proxy Central (Traefik v3.1)
  traefik:
    image: traefik:latest
    environment:
      - DOCKER_API_VERSION=1.45
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      # mode: host para preservar o IP real da Cloudflare (CF-Connecting-IP) e estabilizar WebSockets/SSE
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - ./config/traefik:/etc/traefik:ro
    secrets:
      - source: scsi_origin_crt
        target: /run/secrets/scsi_origin_crt
      - source: scsi_origin_key
        target: /run/secrets/scsi_origin_key
    networks:
      - scsi_public
      - scsi_socket_net
    deploy:
      mode: global # 1 instância em cada nó Manager
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
      labels:
        - "traefik.enable=true"
        # Roteador Seguro do Dashboard com Host e BasicAuth
        - "traefik.http.routers.traefik-dash.rule=Host(`traefik.singulariconsult.com.br`) || Host(`traefik.scsi.pycoder.com.br`)"
        - "traefik.http.routers.traefik-dash.entrypoints=websecure"
        - "traefik.http.routers.traefik-dash.service=api@internal"
        - "traefik.http.routers.traefik-dash.tls=true"
        - "traefik.http.routers.traefik-dash.middlewares=scsi-admin-auth@file,scsi-headers@file"
        # Dummy service port para Swarm
        - "traefik.http.services.traefik-dash.loadbalancer.server.port=8080"

networks:
  # Rede pública para onde o Traefik roteia tráfego aos containers web (Frontend / Backend)
  scsi_public:
    external: true
  # Rede interna estrita para comunicação entre Traefik e Socket Proxy
  scsi_socket_net:
    external: true

secrets:
  scsi_origin_crt:
    external: true
  scsi_origin_key:
    external: true
